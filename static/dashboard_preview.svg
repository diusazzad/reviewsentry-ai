<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>

    <!-- Mesh Glows -->
    <radialGradient id="meshCyan" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshPurple" cx="80%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e1524" stop-opacity="0.85"/>
    </linearGradient>
    
    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Browser Window Wrapper -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="680" fill="url(#meshCyan)"/>
  <rect width="1200" height="680" fill="url(#meshPurple)"/>
  <rect width="1200" height="680" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Browser Header Bar -->
  <rect width="1200" height="44" rx="16" fill="#080c14" fill-opacity="0.9"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="240" y="8" width="720" height="28" rx="8" fill="#111827" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="600" y="26" text-anchor="middle" fill="#9ca3af" font-size="12" class="font-mono">🔒 https://reviewsentry-ai.onrender.com</text>

  <!-- App Header Navigation -->
  <g transform="translate(40, 64)">
    <!-- Logo Shield -->
    <rect width="36" height="36" rx="8" fill="url(#shieldGrad)" filter="url(#glowCyan)"/>
    <path d="M18 10 L26 14 L26 21 C26 25 18 28 18 28 C18 28 10 25 10 21 L10 14 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M15 19 L17 21 L22 16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <text x="48" y="20" fill="#ffffff" font-size="18" font-weight="700" class="font-sans">ReviewSentry <tspan fill="#00e5ff" font-size="11" font-weight="800">AI</tspan></text>
    <text x="48" y="33" fill="#94a3b8" font-size="11" class="font-sans">Google Maps &amp; Yelp Dispute Engine for Local Businesses</text>

    <!-- Header Badges -->
    <rect x="740" y="6" width="190" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="755" cy="19" r="4" fill="#34d399"/>
    <text x="768" y="23" fill="#34d399" font-size="11" font-weight="600" class="font-sans">Backboard SDK / Gemma 2</text>

    <rect x="944" y="6" width="176" height="26" rx="13" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.4"/>
    <circle cx="959" cy="19" r="4" fill="#60a5fa"/>
    <text x="972" y="23" fill="#60a5fa" font-size="11" font-weight="600" class="font-sans">Render Cloud Live (Free Tier)</text>
  </g>

  <!-- Main Content Grid -->
  <g transform="translate(40, 126)">
    
    <!-- LEFT PANEL: Workbench & Input -->
    <rect width="530" height="510" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Review Audit Workbench</text>
    <text x="24" y="52" fill="#94a3b8" font-size="11" class="font-sans">Paste an unfair 1-star review to detect Google Maps policy breaches</text>

    <!-- Sample Buttons Box -->
    <rect x="24" y="70" width="482" height="66" rx="10" fill="#080c14" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="36" y="88" fill="#00e5ff" font-size="10" font-weight="700" letter-spacing="0.5" class="font-sans">⚡ BENCHMARK SAMPLES (CLICK TO TEST):</text>
    
    <!-- Active Pill -->
    <rect x="36" y="98" width="140" height="26" rx="13" fill="#00e5ff" fill-opacity="0.2" stroke="#00e5ff"/>
    <text x="46" y="115" fill="#00e5ff" font-size="11" font-weight="600" class="font-sans">🎯 Competitor Attack</text>
    
    <rect x="184" y="98" width="140" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="194" y="115" fill="#cbd5e1" font-size="11" class="font-sans">⚖️ Defamation / Crime</text>

    <rect x="332" y="98" width="140" height="26" rx="13" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="342" y="115" fill="#cbd5e1" font-size="11" class="font-sans">🛑 Extortion Demand</text>

    <!-- Form Inputs Mockup -->
    <text x="24" y="162" fill="#94a3b8" font-size="11" class="font-sans">Business Profile Name</text>
    <rect x="24" y="172" width="230" height="34" rx="6" fill="#090d16" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="34" y="193" fill="#ffffff" font-size="12" class="font-sans">Brew &amp; Bites Artisan Cafe</text>

    <text x="276" y="162" fill="#94a3b8" font-size="11" class="font-sans">Reviewer Handle</text>
    <rect x="276" y="172" width="230" height="34" rx="6" fill="#090d16" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="286" y="193" fill="#ffffff" font-size="12" class="font-sans">LocalGuide_Troll99</text>

    <text x="24" y="230" fill="#94a3b8" font-size="11" class="font-sans">Customer Review Text</text>
    <rect x="24" y="240" width="482" height="90" rx="8" fill="#090d16" stroke="#00e5ff" stroke-width="1.5"/>
    <text x="36" y="264" fill="#f8fafc" font-size="12" class="font-sans">"Worst coffee ever. Go to the other cafe next door instead of</text>
    <text x="36" y="284" fill="#f8fafc" font-size="12" class="font-sans">here, their beans are ten times fresher and cheaper!"</text>
    <text x="440" y="318" fill="#64748b" font-size="10" class="font-mono">118 chars</text>

    <!-- Analyze Button -->
    <rect x="24" y="348" width="482" height="42" rx="8" fill="url(#btnGrad)" filter="url(#glowCyan)"/>
    <text x="265" y="374" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" class="font-sans">🛡️ Run Policy Audit &amp; Generate Dispute</text>

    <!-- Side Hustle Unit Economics Box -->
    <rect x="24" y="412" width="482" height="74" rx="10" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-opacity="0.25"/>
    <text x="38" y="434" fill="#f59e0b" font-size="14">💡</text>
    <text x="60" y="434" fill="#fde68a" font-size="11" font-weight="700" class="font-sans">The Side Hustle Economics:</text>
    <text x="38" y="454" fill="#fef3c7" font-size="11" class="font-sans">Removing 1 fraudulent 1-star review protects <tspan font-weight="700" fill="#ffffff">5%–9%</tspan> of a local business's monthly</text>
    <text x="38" y="470" fill="#fef3c7" font-size="11" class="font-sans">revenue (Harvard Business School). Freelancers charge <tspan font-weight="700" fill="#ffffff">$29–$49/mo</tspan> per account.</text>

    <!-- RIGHT PANEL: Live Audit Output -->
    <g transform="translate(560, 0)">
      <rect width="560" height="510" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Audit Scorecard Header -->
      <rect x="24" y="24" width="512" height="64" rx="10" fill="#080c14" stroke="#ffffff" stroke-opacity="0.08"/>
      
      <!-- Disputable Badge -->
      <rect x="36" y="38" width="240" height="34" rx="17" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-opacity="0.5"/>
      <circle cx="52" cy="55" r="4" fill="#f87171"/>
      <text x="64" y="60" fill="#fca5a5" font-size="11" font-weight="700" class="font-sans">🚨 Policy Violation Confirmed</text>

      <text x="300" y="48" fill="#64748b" font-size="9" font-weight="700" letter-spacing="0.5" class="font-sans">CONFIDENCE</text>
      <text x="300" y="65" fill="#10b981" font-size="15" font-weight="800" class="font-mono">95%</text>

      <text x="390" y="48" fill="#64748b" font-size="9" font-weight="700" letter-spacing="0.5" class="font-sans">PRIMARY GROUNDS</text>
      <text x="390" y="65" fill="#f87171" font-size="13" font-weight="700" class="font-sans">Google Maps § 2.1</text>

      <!-- Evidence Box -->
      <rect x="24" y="98" width="512" height="48" rx="8" fill="#ef4444" fill-opacity="0.06" stroke="#ef4444" stroke-opacity="0.2"/>
      <text x="36" y="116" fill="#f87171" font-size="10" font-weight="700" class="font-sans">🚩 Identified Violation Evidence in Text:</text>
      <rect x="36" y="124" width="220" height="18" rx="4" fill="#ef4444" fill-opacity="0.2"/>
      <text x="42" y="137" fill="#fee2e2" font-size="10" class="font-mono">"Go to the other cafe next door"</text>

      <!-- Output Tabs -->
      <text x="24" y="170" fill="#00e5ff" font-size="12" font-weight="700" class="font-sans">📑 Official Legal Dispute Notice</text>
      <line x1="24" y1="178" x2="220" y2="178" stroke="#00e5ff" stroke-width="2"/>
      <text x="250" y="170" fill="#64748b" font-size="12" font-weight="600" class="font-sans">💬 Diplomatic Customer Responses</text>

      <!-- Action Bar -->
      <rect x="444" y="190" width="92" height="26" rx="6" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-opacity="0.5"/>
      <text x="490" y="207" text-anchor="middle" fill="#00e5ff" font-size="11" font-weight="600" class="font-sans">📋 Copy Notice</text>

      <!-- Code Box (Generated Legal Dispute) -->
      <rect x="24" y="224" width="512" height="264" rx="8" fill="#050811" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="40" y="250" fill="#e2e8f0" font-size="10.5" font-weight="700" class="font-mono">FORMAL NOTICE OF CONTENT POLICY VIOLATION &amp; REMOVAL REQUEST</text>
      <text x="40" y="268" fill="#94a3b8" font-size="10" class="font-mono">To: Google Maps Platform Trust &amp; Safety Team</text>
      <text x="40" y="284" fill="#94a3b8" font-size="10" class="font-mono">Subject: Urgent Takedown Request — Policy Breach (§ 2.1)</text>
      <text x="40" y="300" fill="#94a3b8" font-size="10" class="font-mono">Business: Brew &amp; Bites Artisan Cafe | Reviewer: LocalGuide_Troll99</text>
      
      <text x="40" y="324" fill="#cbd5e1" font-size="10" font-weight="700" class="font-mono">1. APPLICABLE POLICY CLAUSE:</text>
      <text x="40" y="340" fill="#f87171" font-size="10" class="font-mono">• Clause 2.1 - Conflict of Interest &amp; Competitor Disparagement</text>
      <text x="40" y="356" fill="#94a3b8" font-size="9.5" class="font-mono">  "Content is prohibited if posted by/for a competitor to undermine ratings."</text>

      <text x="40" y="380" fill="#cbd5e1" font-size="10" font-weight="700" class="font-mono">2. RECORD OF INFRACTION &amp; EVIDENCE:</text>
      <text x="40" y="396" fill="#fde68a" font-size="9.5" class="font-mono">  Excerpt: "Go to the other cafe next door instead of here..."</text>
      <text x="40" y="412" fill="#94a3b8" font-size="9.5" class="font-mono">  Direct solicitation violates map contributor guidelines and antitrust rules.</text>

      <text x="40" y="436" fill="#cbd5e1" font-size="10" font-weight="700" class="font-mono">3. RELIEF DEMANDED:</text>
      <text x="40" y="452" fill="#34d399" font-size="10" class="font-mono">  Immediate unpublishing and removal of 1-star weight from aggregate score.</text>
      <text x="40" y="472" fill="#64748b" font-size="9" class="font-mono">  ReviewSentry AI Verified Audit Reference: #9482710</text>
    </g>

  </g>
</svg>
