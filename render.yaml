services:
  - type: web
    name: reviewsentry-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: BACKBOARD_API_KEY
        sync: false
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
